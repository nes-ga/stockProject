<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAND 추천주 분석</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <p class="eyebrow">Band Stock Analyzer</p>
        <h1>추천 종목을 클릭해서 차트와 지표를 바로 확인하세요</h1>
        <p class="hero-copy">
          왼쪽에서 종목을 고르면 추천 기준일 기준 차트, 거래량, 재무지표를 오른쪽에서 바로 볼 수 있습니다.
        </p>
      </header>

      <section class="panel band-panel">
        <div class="panel-head">
          <div>
            <h2>BAND에서 바로 읽기</h2>
            <p class="field-help">.env 설정 후 로그인하면 내 밴드와 게시글을 바로 불러와 분석할 수 있습니다.</p>
          </div>
          <span id="bandConnectionStatus" class="status-badge idle">준비 중</span>
        </div>

        <div id="bandSetupNotice" class="setup-notice"></div>

        <div class="band-actions">
          <button id="bandLoginBtn" class="primary-button" type="button">BAND 로그인</button>
          <button id="bandRefreshBandsBtn" class="ghost-button" type="button">밴드 새로고침</button>
          <button id="bandLogoutBtn" class="ghost-button" type="button">연결 해제</button>
        </div>

        <div class="band-grid">
          <section class="band-column">
            <div class="section-head">
              <h3>1. 내 밴드</h3>
              <span id="bandCountLabel" class="section-meta">0개</span>
            </div>
            <div id="bandList" class="band-list"></div>
          </section>

          <section class="band-column">
            <div class="section-head">
              <h3>2. 게시글</h3>
              <span id="postCountLabel" class="section-meta">0개</span>
            </div>
            <div id="postList" class="post-list"></div>
          </section>
        </div>
      </section>

      <main class="layout">
        <section class="panel input-panel">
          <div class="panel-head">
            <h2>추천 종목</h2>
            <button id="openAddStockBtn" class="ghost-button" type="button">종목 추가</button>
          </div>
          <div class="category-tabs" id="stockCategoryTabs">
            <button class="category-tab active" type="button" data-category="longTerm">중장기</button>
            <button class="category-tab" type="button" data-category="swing">스윙</button>
          </div>
          <p class="field-help">종목 카드를 누르면 바로 해당 종목 분석이 시작됩니다.</p>
          <div class="selector-toolbar">
            <label class="page-size-label" for="pageSizeSelect">표시 개수</label>
            <select id="pageSizeSelect" class="page-size-select">
              <option value="5" selected>5개</option>
              <option value="10">10개</option>
              <option value="999">전체</option>
            </select>
          </div>
          <div id="stockSelector" class="stock-selector"></div>
          <div class="pagination-bar">
            <button id="prevPageBtn" class="ghost-button small-button" type="button">이전</button>
            <span id="pageStatus" class="page-status">1 / 1</span>
            <button id="nextPageBtn" class="ghost-button small-button" type="button">다음</button>
          </div>
        </section>

        <section class="panel output-panel">
          <div class="panel-head">
            <h2>분석 결과</h2>
            <span id="statusBadge" class="status-badge idle">대기 중</span>
          </div>

          <div id="summaryBar" class="summary-bar hidden"></div>
          <div id="errorBox" class="error-box hidden"></div>
          <div id="results" class="results empty">
            <div class="empty-state">
              <p>왼쪽에서 종목 하나를 누르면 결과가 여기에 표시됩니다.</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="stockModal" class="modal-backdrop hidden">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="stockModalTitle">
        <div class="modal-head">
          <h3 id="stockModalTitle">종목 추가</h3>
          <button id="closeStockModalBtn" class="icon-button" type="button" aria-label="닫기">×</button>
        </div>
        <form id="stockForm" class="modal-form">
          <label class="modal-label" for="stockNameInput">종목명</label>
          <input id="stockNameInput" name="name" class="modal-input" type="text" required />

          <label class="modal-label" for="stockSymbolInput">종목코드</label>
          <input id="stockSymbolInput" name="symbol" class="modal-input" type="text" inputmode="numeric" required />

          <label class="modal-label" for="stockPriceInput">추천가</label>
          <input id="stockPriceInput" name="recommendedPrice" class="modal-input" type="number" min="0" step="1" required />

          <label class="modal-label" for="stockDateInput">추천 기준일</label>
          <input id="stockDateInput" name="anchorDate" class="modal-input" type="date" required />

          <label class="modal-label" for="stockCategorySelect">탭 분류</label>
          <select id="stockCategorySelect" name="category" class="modal-input">
            <option value="longTerm">중장기</option>
            <option value="swing">스윙</option>
          </select>

          <label class="modal-label" for="stockNoteInput">메모</label>
          <textarea id="stockNoteInput" name="note" class="modal-textarea" rows="3" placeholder="선택 입력"></textarea>

          <div class="modal-actions">
            <button class="ghost-button" type="button" id="cancelStockModalBtn">취소</button>
            <button class="primary-button" type="submit">추가</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
